<style>

    --bg: #F7F4EE;
    --surface: #EDEAE2;
    --card: #FDFCF9;
    --ink: #1A1815;
    --ink2: #5A5750;
    --ink3: #9A9690;
    --accent: #2D5A3D;
    --accent2: #C8A96E;
    --border: rgba(26,24,21,0.1);
    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'Outfit', sans-serif;
    --mono: 'DM Mono', monospace;
    --radius: 4px;
    --radius-lg: 12px;

  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 1rem 2.5rem; }

  .hero-tag { font-family: var(--mono); font-size: 0.75rem; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 8px; }
  .hero-tag::before { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--accent); }
  .hero-name { font-family: var(--serif); font-size: clamp(3rem, 6vw, 5.5rem); line-height: 1.05; font-weight: 400; margin-bottom: 1.5rem; }
  .hero-name em { font-style: italic; color: var(--accent); }
  .hero-desc { font-size: 1.1rem; color: var(--ink2); max-width: 420px; line-height: 1.8; margin-bottom: 2.5rem; }
  .hero-ctas { display: flex; gap: 1rem; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 0.75rem 1.5rem; font-family: var(--sans); font-size: 0.85rem; font-weight: 500; letter-spacing: 0.05em; text-decoration: none; border-radius: var(--radius); transition: all 0.2s; cursor: pointer; border: none; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #1e3f2a; transform: translateY(-1px); }
  .btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--border); }
  .btn-outline:hover { background: var(--surface); }
  .hero-right { background: var(--surface); display: flex; flex-direction: column; justify-content: flex-end; padding: 4rem 3rem; position: relative; overflow: hidden; }
  .hero-visual { position: absolute; top: 3rem; right: 3rem; width: 200px; height: 200px; border-radius: 50%; border: 2px solid var(--accent2); opacity: 0.3; }
  .hero-visual::after { content: ''; position: absolute; top: 20px; left: 20px; right: 20px; bottom: 20px; border-radius: 50%; border: 1px solid var(--accent2); }
  .hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; }
  .stat-num { font-family: var(--serif); font-size: 2rem; color: var(--accent); display: block; }
  .stat-label { font-size: 0.8rem; color: var(--ink3); font-weight: 400; letter-spacing: 0.05em; }

  section { padding: 6rem 5rem; }
  .section-tag { font-family: var(--mono); font-size: 0.72rem; color: var(--accent); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 8px; }
  .section-tag::before { content: ''; display: inline-block; width: 16px; height: 1px; background: var(--accent); }
  .section-title { font-family: var(--serif); font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 400; line-height: 1.15; margin-bottom: 3rem; }

  #about { background: var(--card); }
  .about-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 5rem; align-items: start; }
  .about-text p { font-size: 1.05rem; color: var(--ink2); margin-bottom: 1.25rem; line-height: 1.9; }
  .about-text p strong { color: var(--ink); font-weight: 500; }
  .skills-block { margin-top: 2.5rem; }
  .skills-title { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink3); margin-bottom: 1rem; }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .skill-tag { padding: 0.35rem 0.85rem; border: 1px solid var(--border); border-radius: 100px; font-size: 0.8rem; color: var(--ink2); background: var(--bg); font-family: var(--mono); }
  .about-sidebar { display: flex; flex-direction: column; gap: 1.25rem; position: sticky; top: 5rem; }
  .info-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; }
  .info-card-label { font-size: 0.72rem; font-family: var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink3); margin-bottom: 0.5rem; }
  .info-card-value { font-size: 0.95rem; color: var(--ink); font-weight: 400; }

  #projects { background: var(--bg); }

  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
  .project-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; }
  .project-card:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(26,24,21,0.08); }
  .project-card.hidden { display: none; }
  .project-header { padding: 1.75rem 1.75rem 1rem; border-bottom: 1px solid var(--border); }
  .project-type { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; padding: 0.25rem 0.7rem; border-radius: 100px; display: inline-block; margin-bottom: 1rem; font-weight: 500; }
  .type-code { background: #E8F0EC; color: var(--accent); }
  .type-pdf { background: #FEF3E8; color: #8B5E2A; }
  .type-research { background: #EEF0FE; color: #3B42A0; }
  .project-title { font-family: var(--serif); font-size: 1.4rem; font-weight: 400; line-height: 1.25; margin-bottom: 0.5rem; }
  .project-course { font-size: 0.8rem; color: var(--ink3); font-family: var(--mono); }
  .project-body { padding: 1.25rem 1.75rem 1.75rem; }
  .project-desc { font-size: 0.9rem; color: var(--ink2); line-height: 1.7; margin-bottom: 1.25rem; }
  .project-tech { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem; }
  .tech-tag { font-family: var(--mono); font-size: 0.72rem; color: var(--ink3); border: 1px solid var(--border); padding: 0.2rem 0.6rem; border-radius: var(--radius); }
  .project-links { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .project-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 500; color: var(--accent); text-decoration: none; padding: 0.4rem 0.9rem; border: 1px solid rgba(45,90,61,0.3); border-radius: var(--radius); transition: all 0.15s; }
  .project-link:hover { background: var(--accent); color: white; }
  .project-link svg { width: 13px; height: 13px; }

  #contact { background: var(--accent); color: white; }
  #contact .section-tag { color: var(--accent2); }
  #contact .section-tag::before { background: var(--accent2); }
  #contact .section-title { color: white; }
  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: center; }
  .contact-text { font-size: 1.05rem; color: rgba(255,255,255,0.75); line-height: 1.85; margin-bottom: 2.5rem; }
  .contact-links { display: flex; flex-direction: column; gap: 1rem; }
  .contact-item { display: flex; align-items: center; gap: 1rem; color: white; text-decoration: none; font-size: 0.95rem; padding: 1rem 1.25rem; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: var(--radius-lg); transition: all 0.2s; }
  .contact-item:hover { background: rgba(255,255,255,0.15); }
  .contact-icon { width: 36px; height: 36px; background: rgba(255,255,255,0.15); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .contact-icon svg { width: 16px; height: 16px; }
  .contact-aside { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-lg); padding: 2.5rem; }
  .contact-aside-title { font-family: var(--serif); font-size: 1.6rem; font-weight: 400; margin-bottom: 1rem; line-height: 1.3; }
  .contact-aside p { color: rgba(255,255,255,0.65); font-size: 0.9rem; line-height: 1.8; }
  .availability { display: inline-flex; align-items: center; gap: 6px; margin-top: 1.5rem; font-size: 0.8rem; font-family: var(--mono); color: rgba(255,255,255,0.7); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #7DD09A; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  footer { background: var(--ink); color: var(--ink3); text-align: center; padding: 2rem; font-size: 0.8rem; font-family: var(--mono); }

  @media (max-width: 900px) {
    #hero { grid-template-columns: 1fr; }
    .hero-left { padding: 4rem 2rem 2rem; }
    .hero-right { padding: 2rem; }
    .hero-stats { grid-template-columns: repeat(3, 1fr); }
    .hero-visual { display: none; }
    section { padding: 4rem 1.75rem; }
    .about-grid, .contact-grid { grid-template-columns: 1fr; gap: 2.5rem; }
    .about-sidebar { position: static; }
    nav { padding: 1rem 1.5rem; }
    .nav-links { gap: 1.25rem; }
  }
  @media (max-width: 600px) {
    .projects-grid { grid-template-columns: 1fr; }
    .hero-stats { grid-template-columns: 1fr 1fr; }
    .nav-links { display: none; }
  }
</style>

    "View PDF": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`,
  };

  PORTFOLIO.projects.forEach(p => {
    const typeLabel = p.type === "code" ? "Code Project" : "Report / PDF";
    const typeClass = p.type === "code" ? "type-code" : "type-pdf";
    const techTags  = p.tech.map(t => `<span class="tech-tag">${t}</span>`).join("");
    const links     = p.links.map(l => `<a class="project-link" href="${l.url}" target="_blank">${icons[l.label] || ""}${l.label}</a>`).join("");
    grid.innerHTML += `
      <div class="project-card" data-type="${p.type}">
        <div class="project-header">
          <span class="project-type ${typeClass}">${typeLabel}</span>
          <h3 class="project-title">${p.title}</h3>
          <p class="project-course">${p.course}</p>
        </div>
        <div class="project-body">
          <p class="project-desc">${p.desc}</p>
          <div class="project-tech">${techTags}</div>
          <div class="project-links">${links}</div>
        </div>
      </div>`;
  });

  // Filter buttons
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const f = btn.dataset.filter;
      document.querySelectorAll(".project-card").forEach(card => {
        card.classList.toggle("hidden", f !== "all" && card.dataset.type !== f);
      });
    });
  });

  const contactIcons = {
    email:    `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`,
    linkedin: `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>`,
    github:   `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>`,
  };
  const clEl = document.getElementById("contact-links");
  PORTFOLIO.contactLinks.forEach(l => {
    clEl.innerHTML += `<a class="contact-item" href="${l.url}" target="_blank"><div class="contact-icon">${contactIcons[l.icon] || ""}</div>${l.label}</a>`;
  });

  document.getElementById("contact-aside").innerHTML = `
    <h3 class="contact-aside-title">${PORTFOLIO.contactAsideTitle}</h3>
    <p>${PORTFOLIO.contactAsideBody}</p>
    <p class="availability"><span class="dot"></span>${PORTFOLIO.contactAvailability}</p>`;

  document.getElementById("footer").innerHTML =
    `&copy; ${new Date().getFullYear()} ${PORTFOLIO.name} &mdash; Built with GitHub Pages`;
})();
</script>
</body>
</html>
